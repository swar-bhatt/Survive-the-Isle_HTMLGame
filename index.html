<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Island Survivor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0; padding: 0; background: #000; color: #0f0;
            font-family: 'Press Start 2P', system-ui;
            overflow: hidden;
        }
        
        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { image-rendering: pixelated; border: 4px solid #0f0; box-shadow: 0 0 30px #0f0; }
        
        .ui-overlay { position: absolute; pointer-events: none; }
        #top-bar, #inventory-bar { pointer-events: auto; }
        
        #top-bar {
            top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,20,0,0.9); padding: 8px 20px;
            border: 3px solid #0f0; display: flex; gap: 20px; font-size: 12px;
        }
        
        .bar { width: 130px; height: 14px; background: #111; border: 2px solid #0f0; position: relative; }
        .bar-fill { height: 100%; transition: width 0.3s; }
        
        #inventory-bar {
            bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,20,0,0.95); padding: 10px; border: 3px solid #0f0;
            display: flex; gap: 10px;
        }
        
        .slot {
            width: 52px; height: 52px; background: #111; border: 3px solid #0f0;
            display: flex; align-items: center; justify-content: center; font-size: 26px;
            cursor: pointer; position: relative;
        }
        .slot:hover { background: #222; border-color: #ff0; }
        .slot.selected { border-color: #ff0; box-shadow: 0 0 12px #ff0; }
        .slot-count { position: absolute; bottom: 2px; right: 4px; font-size: 11px; background: rgba(0,0,0,0.8); padding: 0 4px; }
        
        .message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,30,0,0.95); padding: 20px 40px; border: 4px solid #0f0;
            font-size: 18px; text-align: center; opacity: 0; transition: 0.4s;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game" width="960" height="640"></canvas>
        
        <div id="top-bar" class="ui-overlay">
            ❤️ <div class="bar"><div id="health-bar" class="bar-fill" style="width:100%;background:#f33"></div></div>
            🍖 <div class="bar"><div id="hunger-bar" class="bar-fill" style="width:75%;background:#fa0"></div></div>
            💧 <div class="bar"><div id="thirst-bar" class="bar-fill" style="width:65%;background:#0af"></div></div>
            ⚡ <div class="bar"><div id="energy-bar" class="bar-fill" style="width:90%"></div></div>
            <span>Day <span id="day-count">1</span></span>
        </div>
        
        <div id="inventory-bar" class="ui-overlay"></div>
        
        <div id="message" class="message"></div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        const TILE_SIZE = 32;
        const WORLD_WIDTH = 120;
        const WORLD_HEIGHT = 120;
        
        let player = {
            x: 0, y: 0, size: 24, speed: 3.8,
            health: 100, hunger: 75, thirst: 65, energy: 90
        };
        
        let tiles = [], entities = [], particles = [], inventory = [];
        let camera = {x:0, y:0};
        let keys = {}, mouse = {x:0,y:0};
        let hotbarIndex = 0;
        let day = 1, gameTime = 0;
        
        // ==================== INVENTORY & EATING ====================
        function addItem(id, name, emoji, count = 1) {
            let item = inventory.find(i => i.id === id);
            if (item) item.count += count;
            else inventory.push({id, name, emoji, count});
            renderHotbar();
        }
        
        function useHotbarItem() {
            if (inventory.length === 0) return;
            let item = inventory[hotbarIndex];
            if (!item || item.count <= 0) return;
            
            if (['berry', 'meat', 'cooked_meat'].includes(item.id)) {
                // Eat
                if (item.id === 'berry') {
                    player.hunger = Math.min(100, player.hunger + 18);
                    player.thirst = Math.min(100, player.thirst + 8);
                } else {
                    player.hunger = Math.min(100, player.hunger + 35);
                }
                item.count--;
                if (item.count <= 0) inventory.splice(hotbarIndex, 1);
                
                showMessage("🍖 Ate " + item.name + "!", 1200);
                renderHotbar();
            } else {
                showMessage("Can't use " + item.name + " right now", 1000);
            }
        }
        
        function renderHotbar() {
            const container = document.getElementById('inventory-bar');
            container.innerHTML = '';
            
            for (let i = 0; i < 8; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                if (i === hotbarIndex) slot.classList.add('selected');
                
                if (i < inventory.length) {
                    const item = inventory[i];
                    slot.innerHTML = `${item.emoji}<span class="slot-count">${item.count}</span>`;
                }
                
                slot.onclick = () => {
                    hotbarIndex = i;
                    renderHotbar();
                };
                container.appendChild(slot);
            }
        }
        
        // ==================== GAME SETUP ====================
        function generateWorld() {
            tiles = [];
            for (let y = 0; y < WORLD_HEIGHT; y++) {
                tiles[y] = [];
                for (let x = 0; x < WORLD_WIDTH; x++) {
                    const value = Math.sin(x*0.1) + Math.cos(y*0.1) + Math.random()*0.6;
                    let type = value < 0.3 ? 'water' : value < 0.8 ? 'sand' : 'grass';
                    tiles[y][x] = {type};
                }
            }
            
            player.x = WORLD_WIDTH * TILE_SIZE / 2;
            player.y = WORLD_HEIGHT * TILE_SIZE / 2;
            
            // Starting resources
            entities = [];
            for (let i = 0; i < 160; i++) {
                let x = Math.random() * WORLD_WIDTH * TILE_SIZE;
                let y = Math.random() * WORLD_HEIGHT * TILE_SIZE;
                if (getTile(x, y).type === 'grass') {
                    entities.push({
                        type: Math.random() > 0.5 ? 'tree' : 'bush',
                        x: x, y: y, health: 80,
                        emoji: Math.random() > 0.5 ? '🌳' : '🌿'
                    });
                }
            }
            
            // Starting inventory
            inventory = [
                {id: 'berry', name: 'Berries', emoji: '🫐', count: 12},
                {id: 'wood', name: 'Wood', emoji: '🪵', count: 15},
                {id: 'stone', name: 'Stone', emoji: '🪨', count: 8}
            ];
            renderHotbar();
        }
        
        function getTile(x, y) {
            const tx = Math.floor(x / TILE_SIZE);
            const ty = Math.floor(y / TILE_SIZE);
            if (tx < 0 || tx >= WORLD_WIDTH || ty < 0 || ty >= WORLD_HEIGHT) return {type:'water'};
            return tiles[ty][tx];
        }
        
        function isWalkable(x, y) {
            return getTile(x, y).type !== 'water';
        }
        
        // ==================== INPUT ====================
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            
            if (e.key === 'e' || e.key === 'E') useHotbarItem();
            
            if (e.key >= '1' && e.key <= '8') {
                hotbarIndex = parseInt(e.key) - 1;
                renderHotbar();
            }
        });
        
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });
        
        canvas.addEventListener('click', () => harvest());
        
        function harvest() {
            const wx = camera.x + mouse.x;
            const wy = camera.y + mouse.y;
            
            for (let i = 0; i < entities.length; i++) {
                const e = entities[i];
                const dx = e.x - wx;
                const dy = e.y - wy;
                if (dx*dx + dy*dy < 900) {
                    e.health -= 35;
                    if (e.health <= 0) {
                        if (e.type === 'tree') addItem('wood', 'Wood', '🪵', 6);
                        else if (e.type === 'bush') addItem('berry', 'Berries', '🫐', 4);
                        entities.splice(i, 1);
                        showMessage("Collected!", 800);
                    }
                    break;
                }
            }
        }
        
        // ==================== RENDERING & LOOP ====================
        function updateCamera() {
            camera.x = player.x - canvas.width/2;
            camera.y = player.y - canvas.height/2;
        }
        
        function updatePlayer() {
            let dx = 0, dy = 0;
            if (keys['w'] || keys['arrowup']) dy -= 1;
            if (keys['s'] || keys['arrowdown']) dy += 1;
            if (keys['a'] || keys['arrowleft']) dx -= 1;
            if (keys['d'] || keys['arrowright']) dx += 1;
            
            if (dx || dy) {
                const len = Math.hypot(dx, dy);
                dx /= len; dy /= len;
                
                let newX = player.x + dx * player.speed;
                let newY = player.y + dy * player.speed;
                
                if (isWalkable(newX, player.y)) player.x = newX;
                if (isWalkable(player.x, newY)) player.y = newY;
            }
            
            // Drain
            player.hunger -= 0.012;
            player.thirst -= 0.018;
            if (player.hunger <= 0) player.health -= 0.04;
            if (player.thirst <= 0) player.health -= 0.06;
        }
        
        function render() {
            ctx.fillStyle = '#0a2a4a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const startX = Math.floor(camera.x / TILE_SIZE) - 1;
            const endX = Math.ceil((camera.x + canvas.width) / TILE_SIZE) + 1;
            const startY = Math.floor(camera.y / TILE_SIZE) - 1;
            const endY = Math.ceil((camera.y + canvas.height) / TILE_SIZE) + 1;
            
            for (let y = startY; y < endY; y++) {
                for (let x = startX; x < endX; x++) {
                    if (x < 0 || x >= WORLD_WIDTH || y < 0 || y >= WORLD_HEIGHT) continue;
                    const tile = tiles[y][x];
                    const sx = x * TILE_SIZE - camera.x;
                    const sy = y * TILE_SIZE - camera.y;
                    
                    ctx.fillStyle = tile.type === 'water' ? '#0a2a5a' : 
                                   tile.type === 'sand' ? '#e2c080' : '#1a4a1a';
                    ctx.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);
                }
            }
            
            // Entities
            for (let e of entities) {
                ctx.font = '32px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(e.emoji, e.x - camera.x, e.y - camera.y);
            }
            
            // Player
            const px = player.x - camera.x;
            const py = player.y - camera.y;
            ctx.fillStyle = '#0ff';
            ctx.fillRect(px-12, py-20, 24, 32);
            ctx.fillStyle = '#fdb';
            ctx.fillRect(px-8, py-28, 16, 14);
        }
        
        function showMessage(text, ms = 1500) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.opacity = 1;
            setTimeout(() => msg.style.opacity = 0, ms);
        }
        
        function gameLoop() {
            updatePlayer();
            updateCamera();
            render();
            
            document.getElementById('health-bar').style.width = player.health + '%';
            document.getElementById('hunger-bar').style.width = Math.max(0, player.hunger) + '%';
            document.getElementById('thirst-bar').style.width = Math.max(0, player.thirst) + '%';
            
            if (player.health <= 0) {
                showMessage("💀 YOU DIED...", 999999);
                return;
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        window.onload = () => {
            generateWorld();
            showMessage("🌴 Island Survivor\nPress E to eat\nClick trees/bushes to gather", 3000);
            gameLoop();
        };
    </script>
</body>
</html>
