<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Island Survivor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #0f0;
            font-family: 'Press Start 2P', system-ui;
            overflow: hidden;
            image-rendering: pixelated;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        canvas {
            image-rendering: pixelated;
            border: 4px solid #0f0;
            box-shadow: 0 0 30px #0f0;
        }
        
        .ui-overlay {
            position: absolute;
            pointer-events: none;
        }
        
        #top-bar {
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 20, 0, 0.85);
            padding: 8px 20px;
            border: 3px solid #0f0;
            display: flex;
            gap: 25px;
            font-size: 12px;
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .bar {
            width: 120px;
            height: 12px;
            background: #111;
            border: 2px solid #0f0;
            position: relative;
        }
        
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #0f0, #0f0);
            transition: width 0.3s;
        }
        
        #inventory-bar {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 20, 0, 0.9);
            padding: 8px;
            border: 3px solid #0f0;
            display: flex;
            gap: 8px;
        }
        
        .slot {
            width: 48px;
            height: 48px;
            background: #111;
            border: 3px solid #0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            position: relative;
        }
        
        .slot:hover {
            background: #222;
        }
        
        .slot-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            background: rgba(0,0,0,0.7);
            padding: 0 4px;
        }
        
        #day-night {
            position: absolute;
            top: 80px;
            left: 20px;
            background: rgba(0,20,0,0.8);
            padding: 10px;
            border: 3px solid #0f0;
            font-size: 14px;
        }
        
        #minimap {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 180px;
            height: 180px;
            border: 4px solid #0f0;
            background: #001100;
            image-rendering: pixelated;
        }
        
        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,30,0,0.95);
            padding: 20px 40px;
            border: 4px solid #0f0;
            text-align: center;
            font-size: 18px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        button {
            background: #001100;
            color: #0f0;
            border: 3px solid #0f0;
            padding: 10px 20px;
            font-family: 'Press Start 2P', system-ui;
            cursor: pointer;
            margin: 10px;
        }
        
        button:hover {
            background: #003300;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game" width="960" height="640"></canvas>
        
        <!-- Top Stats -->
        <div id="top-bar" class="ui-overlay">
            <div class="stat">
                <span>❤️</span>
                <div class="bar"><div id="health-bar" class="bar-fill" style="width:100%; background:#f00;"></div></div>
            </div>
            <div class="stat">
                <span>🍖</span>
                <div class="bar"><div id="hunger-bar" class="bar-fill" style="width:75%;"></div></div>
            </div>
            <div class="stat">
                <span>💧</span>
                <div class="bar"><div id="thirst-bar" class="bar-fill" style="width:60%;"></div></div>
            </div>
            <div class="stat">
                <span>⚡</span>
                <div class="bar"><div id="energy-bar" class="bar-fill" style="width:90%;"></div></div>
            </div>
            <div style="margin-left:30px;">Day <span id="day-count">1</span></div>
        </div>
        
        <!-- Day/Night -->
        <div id="day-night" class="ui-overlay">
            <div id="time-display">Morning</div>
            <div id="temp-display">Temp: 24°C</div>
        </div>
        
        <!-- Minimap -->
        <canvas id="minimap" class="ui-overlay" width="180" height="180"></canvas>
        
        <!-- Hotbar -->
        <div id="inventory-bar" class="ui-overlay"></div>
        
        <!-- Message -->
        <div id="message" class="message"></div>
        
        <!-- Crafting Menu (hidden initially) -->
        <div id="crafting-menu" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,30,0,0.95); border:4px solid #0f0; padding:20px; display:none; max-width:500px; font-size:14px;">
            <h2 style="margin:0 0 15px 0; text-align:center;">CRAFTING</h2>
            <div id="crafting-list" style="max-height:400px; overflow-y:auto;"></div>
            <button onclick="closeCrafting()">Close</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimap');
        const minimapCtx = minimapCanvas.getContext('2d');
        
        // Game constants
        const TILE_SIZE = 32;
        const WORLD_WIDTH = 120;
        const WORLD_HEIGHT = 120;
        const VIEW_WIDTH = canvas.width;
        const VIEW_HEIGHT = canvas.height;
        
        // Player
        let player = {
            x: WORLD_WIDTH * TILE_SIZE / 2,
            y: WORLD_HEIGHT * TILE_SIZE / 2,
            size: 24,
            speed: 3.5,
            vx: 0,
            vy: 0,
            health: 100,
            hunger: 75,
            thirst: 60,
            energy: 90,
            level: 1,
            xp: 0,
            tool: 'fists', // fists, axe, pickaxe
            facing: 'down'
        };
        
        // World
        let tiles = [];
        let entities = [];
        let particles = [];
        
        // Inventory
        let inventory = [
            {id: 'wood', name: 'Wood', count: 12, emoji: '🪵'},
            {id: 'stone', name: 'Stone', count: 5, emoji: '🪨'},
            {id: 'fiber', name: 'Fiber', count: 8, emoji: '🌿'}
        ];
        let hotbarIndex = 0;
        
        // Game state
        let camera = {x: 0, y: 0};
        let keys = {};
        let mouse = {x: 0, y: 0, down: false};
        let timeOfDay = 0; // 0 to 1 (full day)
        let day = 1;
        let gameTime = 0;
        let isNight = false;
        let score = 0; // survival time
        
        // Resources & crafting recipes
        const recipes = [
            {
                name: "Stone Axe",
                result: {id: 'axe', emoji: '🪓'},
                ingredients: [{id:'wood', count:4}, {id:'stone', count:3}]
            },
            {
                name: "Campfire",
                result: {id: 'campfire', emoji: '🔥'},
                ingredients: [{id:'wood', count:8}, {id:'stone', count:4}]
            },
            {
                name: "Wood Spear",
                result: {id: 'spear', emoji: '🔱'},
                ingredients: [{id:'wood', count:6}, {id:'fiber', count:3}]
            }
        ];
        
        // Input
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === 'c' || e.key === 'C') toggleCrafting();
            if (e.key === 'e' || e.key === 'E') interact();
            if (e.key >= '1' && e.key <= '9') hotbarIndex = parseInt(e.key) - 1;
        });
        
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });
        
        canvas.addEventListener('mousedown', () => {
            mouse.down = true;
            harvest();
        });
        
        canvas.addEventListener('mouseup', () => mouse.down = false);
        
        // Simple noise function for procedural generation
        function noise(x, y) {
            let n = x + y * 57;
            n = (n << 13) ^ n;
            return (1.0 - ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 1073741824.0);
        }
        
        function generateWorld() {
            tiles = [];
            for (let y = 0; y < WORLD_HEIGHT; y++) {
                tiles[y] = [];
                for (let x = 0; x < WORLD_WIDTH; x++) {
                    const distFromCenter = Math.sqrt(Math.pow(x - WORLD_WIDTH/2, 2) + Math.pow(y - WORLD_HEIGHT/2, 2));
                    let value = noise(x * 0.1, y * 0.1) * 0.8 + noise(x * 0.3, y * 0.3) * 0.2;
                    
                    let type = 'water';
                    if (distFromCenter < 35 + value * 15) {
                        if (value > 0.3) type = 'grass';
                        else if (value > 0) type = 'sand';
                        else type = 'shallow';
                    }
                    tiles[y][x] = {type: type, variation: Math.random()};
                }
            }
            
            // Add entities
            entities = [];
            for (let i = 0; i < 180; i++) {
                let tx = Math.floor(Math.random() * WORLD_WIDTH);
                let ty = Math.floor(Math.random() * WORLD_HEIGHT);
                if (tiles[ty][tx].type === 'grass') {
                    if (Math.random() > 0.6) {
                        entities.push({
                            type: 'tree',
                            x: tx * TILE_SIZE + TILE_SIZE/2,
                            y: ty * TILE_SIZE + TILE_SIZE/2,
                            health: 100,
                            emoji: '🌳'
                        });
                    } else if (Math.random() > 0.7) {
                        entities.push({
                            type: 'rock',
                            x: tx * TILE_SIZE + TILE_SIZE/2,
                            y: ty * TILE_SIZE + TILE_SIZE/2,
                            health: 80,
                            emoji: '🪨'
                        });
                    } else {
                        entities.push({
                            type: 'bush',
                            x: tx * TILE_SIZE + TILE_SIZE/2,
                            y: ty * TILE_SIZE + TILE_SIZE/2,
                            health: 40,
                            emoji: '🌿'
                        });
                    }
                }
            }
            
            // Spawn animals
            for (let i = 0; i < 12; i++) {
                let tx = Math.floor(Math.random() * WORLD_WIDTH);
                let ty = Math.floor(Math.random() * WORLD_HEIGHT);
                if (tiles[ty][tx].type === 'grass') {
                    entities.push({
                        type: 'rabbit',
                        x: tx * TILE_SIZE + TILE_SIZE/2,
                        y: ty * TILE_SIZE + TILE_SIZE/2,
                        vx: (Math.random()-0.5)*1.2,
                        vy: (Math.random()-0.5)*1.2,
                        health: 30,
                        emoji: '🐇'
                    });
                }
            }
            
            // Place player on grass
            let startX = WORLD_WIDTH * TILE_SIZE / 2;
            let startY = WORLD_HEIGHT * TILE_SIZE / 2;
            player.x = startX;
            player.y = startY;
        }
        
        function getTile(x, y) {
            const tx = Math.floor(x / TILE_SIZE);
            const ty = Math.floor(y / TILE_SIZE);
            if (tx < 0 || tx >= WORLD_WIDTH || ty < 0 || ty >= WORLD_HEIGHT) return {type: 'water'};
            return tiles[ty][tx];
        }
        
        function isWalkable(x, y) {
            const tile = getTile(x, y);
            return tile.type !== 'water';
        }
        
        function updateCamera() {
            camera.x = player.x - VIEW_WIDTH / 2;
            camera.y = player.y - VIEW_HEIGHT / 2;
            
            // Bounds
            camera.x = Math.max(0, Math.min(camera.x, WORLD_WIDTH * TILE_SIZE - VIEW_WIDTH));
            camera.y = Math.max(0, Math.min(camera.y, WORLD_HEIGHT * TILE_SIZE - VIEW_HEIGHT));
        }
        
        function updatePlayer() {
            let dx = 0, dy = 0;
            
            if (keys['w'] || keys['arrowup']) dy -= 1;
            if (keys['s'] || keys['arrowdown']) dy += 1;
            if (keys['a'] || keys['arrowleft']) dx -= 1;
            if (keys['d'] || keys['arrowright']) dx += 1;
            
            if (dx !== 0 || dy !== 0) {
                const len = Math.sqrt(dx*dx + dy*dy);
                dx /= len;
                dy /= len;
                
                const newX = player.x + dx * player.speed;
                const newY = player.y + dy * player.speed;
                
                if (isWalkable(newX - player.size/2, player.y)) player.x = newX;
                if (isWalkable(player.x, newY - player.size/2)) player.y = newY;
                if (isWalkable(newX + player.size/2, player.y)) player.x = newX;
                if (isWalkable(player.x, newY + player.size/2)) player.y = newY;
                
                // Simple facing
                if (Math.abs(dx) > Math.abs(dy)) {
                    player.facing = dx > 0 ? 'right' : 'left';
                } else {
                    player.facing = dy > 0 ? 'down' : 'up';
                }
            }
            
            // Survival drain
            player.hunger = Math.max(0, player.hunger - 0.008);
            player.thirst = Math.max(0, player.thirst - 0.012);
            player.energy = Math.max(0, player.energy - 0.005);
            
            if (player.hunger <= 0) player.health -= 0.03;
            if (player.thirst <= 0) player.health -= 0.05;
            
            player.health = Math.max(0, player.health);
        }
        
        function updateEntities() {
            for (let i = entities.length - 1; i >= 0; i--) {
                const e = entities[i];
                
                if (e.type === 'rabbit') {
                    e.x += e.vx;
                    e.y += e.vy;
                    
                    // Bounce off water
                    if (!isWalkable(e.x, e.y)) {
                        e.vx *= -1;
                        e.vy *= -1;
                    }
                    
                    // Random direction change
                    if (Math.random() < 0.02) {
                        e.vx = (Math.random() - 0.5) * 1.8;
                        e.vy = (Math.random() - 0.5) * 1.8;
                    }
                }
            }
        }
        
        function updateTime() {
            gameTime += 0.008;
            timeOfDay = (gameTime % 240) / 240; // ~4 minute day cycle
            
            isNight = timeOfDay > 0.65 || timeOfDay < 0.2;
            
            if (gameTime % 240 < 0.1) {
                day++;
                document.getElementById('day-count').textContent = day;
            }
        }
        
        function createParticle(x, y, color) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                life: 35,
                color: color
            });
        }
        
        function harvest() {
            const worldMouseX = camera.x + mouse.x;
            const worldMouseY = camera.y + mouse.y;
            
            for (let i = 0; i < entities.length; i++) {
                const e = entities[i];
                const dx = e.x - worldMouseX;
                const dy = e.y - worldMouseY;
                
                if (dx*dx + dy*dy < 1200) {
                    if (e.type === 'tree' || e.type === 'bush' || e.type === 'rock') {
                        e.health -= 25;
                        
                        if (e.type === 'tree') createParticle(e.x, e.y, '#3a3');
                        if (e.type === 'rock') createParticle(e.x, e.y, '#888');
                        
                        if (e.health <= 0) {
                            // Drop resources
                            if (e.type === 'tree') {
                                addToInventory('wood', 5 + Math.floor(Math.random()*4));
                                addToInventory('fiber', 2);
                            } else if (e.type === 'rock') {
                                addToInventory('stone', 4 + Math.floor(Math.random()*3));
                            } else if (e.type === 'bush') {
                                addToInventory('fiber', 5);
                            }
                            entities.splice(i, 1);
                            showMessage("Resource collected!", 1200);
                        }
                        break;
                    }
                }
            }
        }
        
        function addToInventory(id, count) {
            let found = inventory.find(item => item.id === id);
            if (found) {
                found.count += count;
            } else {
                let emoji = id === 'wood' ? '🪵' : id === 'stone' ? '🪨' : '🌿';
                inventory.push({id: id, name: id.charAt(0).toUpperCase() + id.slice(1), count: count, emoji: emoji});
            }
            renderHotbar();
        }
        
        function renderHotbar() {
            const container = document.getElementById('inventory-bar');
            container.innerHTML = '';
            
            for (let i = 0; i < 8; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                if (i < inventory.length) {
                    const item = inventory[i];
                    slot.innerHTML = `${item.emoji}<span class="slot-count">${item.count}</span>`;
                    if (i === hotbarIndex) slot.style.borderColor = '#ff0';
                } else {
                    slot.innerHTML = ' ';
                }
                container.appendChild(slot);
            }
        }
        
        function renderWorld() {
            ctx.fillStyle = '#0a3a5a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const startX = Math.floor(camera.x / TILE_SIZE) - 1;
            const startY = Math.floor(camera.y / TILE_SIZE) - 1;
            const endX = Math.ceil((camera.x + VIEW_WIDTH) / TILE_SIZE) + 1;
            const endY = Math.ceil((camera.y + VIEW_HEIGHT) / TILE_SIZE) + 1;
            
            // Draw tiles
            for (let y = startY; y < endY; y++) {
                for (let x = startX; x < endX; x++) {
                    if (x < 0 || x >= WORLD_WIDTH || y < 0 || y >= WORLD_HEIGHT) continue;
                    
                    const tile = tiles[y][x];
                    const screenX = x * TILE_SIZE - camera.x;
                    const screenY = y * TILE_SIZE - camera.y;
                    
                    if (tile.type === 'water') {
                        ctx.fillStyle = '#0a3a5a';
                    } else if (tile.type === 'shallow') {
                        ctx.fillStyle = '#1e7a9a';
                    } else if (tile.type === 'sand') {
                        ctx.fillStyle = '#e2c080';
                    } else {
                        ctx.fillStyle = '#1a4a1a';
                    }
                    
                    ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
                    
                    // Variation grass lines
                    if (tile.type === 'grass') {
                        ctx.fillStyle = '#163d16';
                        ctx.fillRect(screenX + 8, screenY + 12, 6, 4);
                    }
                }
            }
            
            // Draw entities
            for (let entity of entities) {
                const screenX = entity.x - camera.x;
                const screenY = entity.y - camera.y;
                
                ctx.font = '28px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(entity.emoji, screenX, screenY);
            }
            
            // Draw player
            const px = player.x - camera.x;
            const py = player.y - camera.y;
            
            ctx.fillStyle = '#0ff';
            ctx.fillRect(px - player.size/2, py - player.size/2 - 8, player.size, player.size);
            
            // Head
            ctx.fillStyle = '#fdb';
            ctx.fillRect(px - 8, py - player.size/2 - 18, 16, 14);
            
            // Simple tool
            ctx.fillStyle = '#aaa';
            if (player.tool === 'axe') {
                ctx.fillRect(px + 12, py - 5, 18, 6);
            }
        }
        
        function renderParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                p.vy += 0.2;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                
                ctx.globalAlpha = p.life / 35;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - camera.x, p.y - camera.y, 6, 6);
            }
            ctx.globalAlpha = 1;
        }
        
        function updateMinimap() {
            minimapCtx.fillStyle = '#001100';
            minimapCtx.fillRect(0, 0, 180, 180);
            
            const scaleX = 180 / (WORLD_WIDTH * TILE_SIZE);
            const scaleY = 180 / (WORLD_HEIGHT * TILE_SIZE);
            
            // Draw land
            minimapCtx.fillStyle = '#0a3';
            for (let y = 0; y < WORLD_HEIGHT; y += 4) {
                for (let x = 0; x < WORLD_WIDTH; x += 4) {
                    if (tiles[y][x].type !== 'water') {
                        minimapCtx.fillRect(x * scaleX * TILE_SIZE, y * scaleY * TILE_SIZE, 5, 5);
                    }
                }
            }
            
            // Player
            minimapCtx.fillStyle = '#0ff';
            const px = (player.x * scaleX);
            const py = (player.y * scaleY);
            minimapCtx.fillRect(px - 4, py - 4, 8, 8);
        }
        
        function updateUI() {
            document.getElementById('health-bar').style.width = player.health + '%';
            document.getElementById('hunger-bar').style.width = player.hunger + '%';
            document.getElementById('thirst-bar').style.width = player.thirst + '%';
            document.getElementById('energy-bar').style.width = player.energy + '%';
            
            const timeEl = document.getElementById('time-display');
            if (isNight) {
                timeEl.textContent = '🌙 NIGHT';
                timeEl.style.color = '#88f';
            } else {
                timeEl.textContent = '☀️ DAY';
                timeEl.style.color = '#ff0';
            }
        }
        
        function showMessage(text, duration = 1800) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.opacity = 1;
            setTimeout(() => msg.style.opacity = 0, duration);
        }
        
        function toggleCrafting() {
            const menu = document.getElementById('crafting-menu');
            if (menu.style.display === 'block') {
                menu.style.display = 'none';
            } else {
                renderCraftingMenu();
                menu.style.display = 'block';
            }
        }
        
        function closeCrafting() {
            document.getElementById('crafting-menu').style.display = 'none';
        }
        
        function renderCraftingMenu() {
            const container = document.getElementById('crafting-list');
            container.innerHTML = '';
            
            recipes.forEach((recipe, index) => {
                const div = document.createElement('div');
                div.style.padding = '12px';
                div.style.margin = '6px 0';
                div.style.border = '2px solid #0a0';
                div.style.cursor = 'pointer';
                div.innerHTML = `<strong>${recipe.name}</strong> <span style="float:right">${recipe.result.emoji}</span>`;
                
                let canCraft = true;
                let reqHTML = 'Requires: ';
                
                recipe.ingredients.forEach(ing => {
                    const has = inventory.find(i => i.id === ing.id);
                    const hasCount = has ? has.count : 0;
                    reqHTML += `${ing.count} ${ing.id} `;
                    if (hasCount < ing.count) canCraft = false;
                });
                
                div.innerHTML += `<div style="font-size:11px; margin-top:6px;">${reqHTML}</div>`;
                
                if (canCraft) {
                    div.onclick = () => {
                        // Craft
                        recipe.ingredients.forEach(ing => {
                            const item = inventory.find(i => i.id === ing.id);
                            if (item) item.count -= ing.count;
                        });
                        
                        addToInventory(recipe.result.id, 1);
                        showMessage(`Crafted ${recipe.name}!`);
                        renderCraftingMenu();
                        renderHotbar();
                    };
                } else {
                    div.style.opacity = '0.5';
                }
                
                container.appendChild(div);
            });
        }
        
        function interact() {
            // Placeholder for future interactions (fishing, building etc.)
            showMessage("Nothing nearby to interact with", 900);
        }
        
        function gameLoop() {
            updatePlayer();
            updateEntities();
            updateTime();
            updateCamera();
            
            renderWorld();
            renderParticles();
            
            updateMinimap();
            updateUI();
            
            // Random resource respawn
            if (Math.random() < 0.008 && entities.length < 220) {
                const tx = Math.floor(Math.random() * WORLD_WIDTH);
                const ty = Math.floor(Math.random() * WORLD_HEIGHT);
                if (tiles[ty][tx].type === 'grass') {
                    entities.push({
                        type: Math.random() > 0.5 ? 'bush' : 'rock',
                        x: tx * TILE_SIZE + TILE_SIZE/2,
                        y: ty * TILE_SIZE + TILE_SIZE/2,
                        health: 60,
                        emoji: Math.random() > 0.5 ? '🌿' : '🪨'
                    });
                }
            }
            
            // Win/lose condition
            if (player.health <= 0) {
                showMessage("💀 YOU PERISHED...", 999999);
                return;
            }
            
            score += 1;
            requestAnimationFrame(gameLoop);
        }
        
        // Initialize
        function init() {
            generateWorld();
            renderHotbar();
            showMessage("🌴 Welcome to Island Survivor! Survive as long as you can.", 2800);
            
            // Demo resources
            setTimeout(() => {
                addToInventory('wood', 8);
            }, 1200);
            
            gameLoop();
        }
        
        // Save / Load
        function saveGame() {
            const saveData = {
                player: player,
                inventory: inventory,
                day: day,
                score: score
            };
            localStorage.setItem('islandSurvivorSave', JSON.stringify(saveData));
            showMessage("💾 Game Saved");
        }
        
        function loadGame() {
            const saved = localStorage.getItem('islandSurvivorSave');
            if (saved) {
                const data = JSON.parse(saved);
                Object.assign(player, data.player);
                inventory = data.inventory || inventory;
                day = data.day || 1;
                score = data.score || 0;
                showMessage("📂 Game Loaded");
                renderHotbar();
            }
        }
        window.addEventListener('keydown', e => {
            if (e.key.toLowerCase() === 's' && keys['control']) saveGame();
            if (e.key.toLowerCase() === 'l' && keys['control']) loadGame();
        });
        
        window.onload = init;
    </script>
</body>
</html>
