<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Island Survivor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0; padding: 0; background: #000; color: #0f0;
            font-family: 'Press Start 2P', system-ui;
            overflow: hidden;
        }
        
        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { image-rendering: pixelated; border: 4px solid #0f0; box-shadow: 0 0 30px #0f0; }
        
        .ui-overlay { position: absolute; pointer-events: none; }
        #top-bar, #inventory-bar { pointer-events: auto; }
        
        #top-bar {
            top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,20,0,0.9); padding: 10px 25px;
            border: 3px solid #0f0; display: flex; gap: 25px; font-size: 13px;
        }
        
        .bar { width: 140px; height: 16px; background: #111; border: 2px solid #0f0; position: relative; }
        .bar-fill { height: 100%; transition: width 0.4s; }
        
        #inventory-bar {
            bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,20,0,0.95); padding: 10px; border: 3px solid #0f0;
            display: flex; gap: 10px;
        }
        
        .slot {
            width: 54px; height: 54px; background: #111; border: 3px solid #0f0;
            display: flex; align-items: center; justify-content: center; font-size: 28px;
            cursor: pointer; position: relative;
        }
        .slot:hover { background: #222; border-color: #ff0; }
        .slot.selected { border-color: #ff0; box-shadow: 0 0 15px #ff0; }
        .slot-count { position: absolute; bottom: 3px; right: 5px; font-size: 12px; background: rgba(0,0,0,0.85); padding: 0 5px; }
        
        .message {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,40,0,0.95); padding: 25px 45px; border: 4px solid #0f0;
            font-size: 18px; text-align: center; opacity: 0; transition: opacity 0.5s;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game" width="960" height="640"></canvas>
        
        <div id="top-bar" class="ui-overlay">
            ❤️ <div class="bar"><div id="health-bar" class="bar-fill" style="width:100%;background:#f33"></div></div>
            🍖 <div class="bar"><div id="hunger-bar" class="bar-fill" style="width:100%;background:#fa0"></div></div>
            💧 <div class="bar"><div id="thirst-bar" class="bar-fill" style="width:100%;background:#0af"></div></div>
            <span>Day <span id="day-count">1</span></span>
        </div>
        
        <div id="inventory-bar" class="ui-overlay"></div>
        <div id="message" class="message"></div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        const TILE_SIZE = 32;
        const WORLD_WIDTH = 120;
        const WORLD_HEIGHT = 120;
        
        let player = { x: 0, y: 0, size: 24, speed: 3.8, health: 100, hunger: 100, thirst: 100 };
        let tiles = [], entities = [], inventory = [];
        let camera = {x:0, y:0};
        let keys = {}, mouse = {x:0, y:0};
        let hotbarIndex = 0;
        let day = 1;
        let gameTime = 0;
        let lastFrame = Date.now();
        
        // ==================== INVENTORY ====================
        function addItem(id, name, emoji, count = 1) {
            let item = inventory.find(i => i.id === id);
            if (item) item.count += count;
            else inventory.push({id, name, emoji, count});
            renderHotbar();
        }
        
        function useHotbarItem() {
            if (inventory.length === 0) return;
            const item = inventory[hotbarIndex];
            if (!item || item.count <= 0) return;
            
            if (item.id === 'berry') {
                if (player.hunger >= 100 && player.thirst >= 100) {
                    showMessage("You're already full!", 1000);
                    return;
                }
                player.hunger = Math.min(100, player.hunger + 25);
                player.thirst = Math.min(100, player.thirst + 15);
                showMessage("🫐 Ate Berries", 1000);
            } 
            else if (item.id === 'sapling') {
                plantSapling();
                return;
            }
            
            item.count--;
            if (item.count <= 0) inventory.splice(hotbarIndex, 1);
            renderHotbar();
        }
        
        function plantSapling() {
            const item = inventory[hotbarIndex];
            if (item.id !== 'sapling' || item.count <= 0) return;
            
            const px = player.x + (Math.random() * 60 - 30);
            const py = player.y + (Math.random() * 60 - 30);
            if (getTile(px, py).type === 'grass') {
                entities.push({ type: 'sapling', x: px, y: py, health: 100, growth: 0, emoji: '🌱' });
                item.count--;
                if (item.count <= 0) inventory.splice(hotbarIndex, 1);
                showMessage("🌱 Sapling Planted", 1000);
                renderHotbar();
            } else {
                showMessage("❌ Plant on grass only!", 1000);
            }
        }
        
        function drinkWater() {
            if (player.thirst >= 100) return showMessage("💧 You're not thirsty!", 1000);
            if (isNearWater()) {
                player.thirst = Math.min(100, player.thirst + 48);
                showMessage("💧 Drank Water", 1000);
            } else {
                showMessage("❌ Get closer to water!", 1200);
            }
        }
        
        function expandLand() {
            const wood = inventory.find(i => i.id === 'wood');
            if (!wood || wood.count < 20) {
                showMessage("❌ Need 20 Wood to expand land!", 1200);
                return;
            }
            
            let expanded = false;
            const radius = 3;
            const px = Math.floor(player.x / TILE_SIZE);
            const py = Math.floor(player.y / TILE_SIZE);
            
            for (let y = py - radius; y <= py + radius; y++) {
                for (let x = px - radius; x <= px + radius; x++) {
                    if (x < 0 || x >= WORLD_WIDTH || y < 0 || y >= WORLD_HEIGHT) continue;
                    if (tiles[y][x].type === 'water') {
                        tiles[y][x].type = Math.random() > 0.5 ? 'sand' : 'grass';
                        expanded = true;
                    }
                }
            }
            
            if (expanded) {
                wood.count -= 20;
                if (wood.count <= 0) inventory.splice(inventory.indexOf(wood), 1);
                showMessage("🌍 Land Expanded! (+New Area)", 1300);
                renderHotbar();
            }
        }
        
        function renderHotbar() {
            const container = document.getElementById('inventory-bar');
            container.innerHTML = '';
            for (let i = 0; i < 8; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                if (i === hotbarIndex) slot.classList.add('selected');
                if (i < inventory.length) {
                    const it = inventory[i];
                    slot.innerHTML = `${it.emoji}<span class="slot-count">${it.count}</span>`;
                }
                slot.onclick = () => { hotbarIndex = i; renderHotbar(); };
                container.appendChild(slot);
            }
        }
        
        // ==================== WORLD GENERATION ====================
        function generateWorld() {
            tiles = [];
            for (let y = 0; y < WORLD_HEIGHT; y++) {
                tiles[y] = [];
                for (let x = 0; x < WORLD_WIDTH; x++) {
                    const n = Math.sin(x*0.09) + Math.cos(y*0.09) + Math.random()*0.8;
                    const type = n < 0.5 ? 'water' : n < 1.1 ? 'sand' : 'grass';
                    tiles[y][x] = {type};
                }
            }
            
            // Safe spawn on grass
            let spawnX = WORLD_WIDTH * TILE_SIZE / 2;
            let spawnY = WORLD_HEIGHT * TILE_SIZE / 2;
            
            for (let i = 0; i < 100; i++) {
                const tx = Math.floor(spawnX / TILE_SIZE) + (Math.random() * 20 - 10);
                const ty = Math.floor(spawnY / TILE_SIZE) + (Math.random() * 20 - 10);
                if (tiles[ty] && tiles[ty][tx] && tiles[ty][tx].type === 'grass') {
                    spawnX = tx * TILE_SIZE + TILE_SIZE/2;
                    spawnY = ty * TILE_SIZE + TILE_SIZE/2;
                    break;
                }
            }
            
            player.x = spawnX;
            player.y = spawnY;
            
            entities = [];
            for (let i = 0; i < 230; i++) {
                const x = Math.random() * WORLD_WIDTH * TILE_SIZE;
                const y = Math.random() * WORLD_HEIGHT * TILE_SIZE;
                if (getTile(x, y).type === 'grass') {
                    const rand = Math.random();
                    if (rand < 0.18) entities.push({ type: 'berryTree', x: x, y: y, health: 90, emoji: '🍒' });
                    else if (rand < 0.65) entities.push({ type: 'tree', x: x, y: y, health: 100, emoji: '🌳' });
                    else entities.push({ type: 'bush', x: x, y: y, health: 50, emoji: '🌿' });
                }
            }
            
            inventory = [
                {id: 'berry', name: 'Berries', emoji: '🫐', count: 12},
                {id: 'wood', name: 'Wood', emoji: '🪵', count: 25},
                {id: 'sapling', name: 'Sapling', emoji: '🌱', count: 5}
            ];
            renderHotbar();
        }
        
        function getTile(x, y) {
            const tx = Math.floor(x / TILE_SIZE);
            const ty = Math.floor(y / TILE_SIZE);
            if (tx < 0 || tx >= WORLD_WIDTH || ty < 0 || ty >= WORLD_HEIGHT) return {type: 'water'};
            return tiles[ty][tx];
        }
        
        function isWalkable(x, y) {
            return getTile(x, y).type !== 'water';
        }
        
        function isNearWater() {
            for (let dx = -45; dx <= 45; dx += 15) {
                for (let dy = -45; dy <= 45; dy += 15) {
                    if (getTile(player.x + dx, player.y + dy).type === 'water') return true;
                }
            }
            return false;
        }
        
        function harvest() {
            const wx = camera.x + mouse.x;
            const wy = camera.y + mouse.y;
            for (let i = 0; i < entities.length; i++) {
                const e = entities[i];
                const dx = e.x - wx;
                const dy = e.y - wy;
                if (dx*dx + dy*dy < 1300) {
                    e.health -= 48;
                    if (e.health <= 0) {
                        if (e.type === 'tree') {
                            addItem('wood', 'Wood', '🪵', 6);
                            addItem('sapling', 'Sapling', '🌱', 1);
                        } else if (e.type === 'berryTree') {
                            addItem('berry', 'Berries', '🫐', 8);
                            addItem('sapling', 'Sapling', '🌱', 1);
                        } else if (e.type === 'bush') {
                            addItem('berry', 'Berries', '🫐', 5);
                        }
                        entities.splice(i, 1);
                    }
                    return;
                }
            }
        }
        
        // ==================== INPUT ====================
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === 'e' || e.key === 'E') useHotbarItem();
            if (e.key === 'f' || e.key === 'F') drinkWater();
            if (e.key === 'v' || e.key === 'V') expandLand();
            
            if (e.key >= '1' && e.key <= '8') {
                hotbarIndex = parseInt(e.key) - 1;
                renderHotbar();
            }
        });
        
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });
        canvas.addEventListener('click', harvest);
        
        // ==================== GAME LOOP ====================
        function updateCamera() {
            camera.x = player.x - canvas.width / 2;
            camera.y = player.y - canvas.height / 2;
        }
        
        function updatePlayer(delta) {
            let dx = 0, dy = 0;
            if (keys['w'] || keys['arrowup']) dy -= 1;
            if (keys['s'] || keys['arrowdown']) dy += 1;
            if (keys['a'] || keys['arrowleft']) dx -= 1;
            if (keys['d'] || keys['arrowright']) dx += 1;
            
            if (dx || dy) {
                const len = Math.hypot(dx, dy);
                dx /= len; dy /= len;
                const newX = player.x + dx * player.speed;
                const newY = player.y + dy * player.speed;
                if (isWalkable(newX, player.y)) player.x = newX;
                if (isWalkable(player.x, newY)) player.y = newY;
            }
            
            player.hunger -= 0.0008 * delta;
            player.thirst -= 0.0020 * delta;
            
            if (player.hunger <= 0) player.health -= 0.015 * delta;
            if (player.thirst <= 0) player.health -= 0.025 * delta;
            
            player.hunger = Math.max(0, player.hunger);
            player.thirst = Math.max(0, player.thirst);
            
            // Health Regeneration
            if (player.health < 100) {
                let regenRate = 0;
                if (player.hunger > 85 && player.thirst > 85) regenRate = 0.022;
                else if (player.hunger > 65 && player.thirst > 65) regenRate = 0.009;
                player.health += regenRate * delta;
                if (player.health > 100) player.health = 100;
            }
        }
        
        function updateEntities() {
            for (let e of entities) {
                if (e.type === 'sapling') {
                    e.growth = (e.growth || 0) + 0.016;
                    if (e.growth >= 100) {
                        e.type = 'tree';
                        e.emoji = '🌳';
                        e.health = 100;
                    }
                }
            }
        }
        
        function render() {
            ctx.fillStyle = '#0a2a4a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const startX = Math.floor(camera.x / TILE_SIZE) - 1;
            const endX = Math.ceil((camera.x + canvas.width) / TILE_SIZE) + 1;
            const startY = Math.floor(camera.y / TILE_SIZE) - 1;
            const endY = Math.ceil((camera.y + canvas.height) / TILE_SIZE) + 1;
            
            for (let y = startY; y < endY; y++) {
                for (let x = startX; x < endX; x++) {
                    if (x < 0 || x >= WORLD_WIDTH || y < 0 || y >= WORLD_HEIGHT) continue;
                    const tile = tiles[y][x];
                    const sx = x * TILE_SIZE - camera.x;
                    const sy = y * TILE_SIZE - camera.y;
                    ctx.fillStyle = tile.type === 'water' ? '#0a2a5a' : 
                                   tile.type === 'sand' ? '#e2c080' : '#1a4a1a';
                    ctx.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);
                }
            }
            
            for (let e of entities) {
                ctx.font = e.type === 'sapling' ? '26px Arial' : '36px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(e.emoji, e.x - camera.x, e.y - camera.y);
            }
            
            const px = player.x - camera.x;
            const py = player.y - camera.y;
            ctx.fillStyle = '#0ff';
            ctx.fillRect(px - 12, py - 22, 24, 36);
            ctx.fillStyle = '#fdb';
            ctx.fillRect(px - 8, py - 30, 16, 15);
        }
        
        function showMessage(text, ms = 1400) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.opacity = 1;
            setTimeout(() => msg.style.opacity = 0, ms);
        }
        
        function gameLoop() {
            const now = Date.now();
            const delta = now - lastFrame;
            lastFrame = now;
            
            gameTime += delta;
            if (gameTime > 120000) {
                gameTime = 0;
                day++;
                document.getElementById('day-count').textContent = day;
            }
            
            updatePlayer(delta);
            updateEntities();
            updateCamera();
            render();
            
            document.getElementById('health-bar').style.width = player.health + '%';
            document.getElementById('hunger-bar').style.width = player.hunger + '%';
            document.getElementById('thirst-bar').style.width = player.thirst + '%';
            
            if (player.health <= 0) {
                showMessage("💀 YOU PERISHED...", 999999);
                return;
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        window.onload = () => {
            generateWorld();
            showMessage("🌍 Press V with 20 Wood to expand land!\nF = Drink | E = Eat/Plant | Click = Harvest", 5000);
            gameLoop();
        };
    </script>
</body>
</html>
